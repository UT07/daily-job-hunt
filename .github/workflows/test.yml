name: Test Suite

on:
  pull_request:
  push:
    branches: [main, 'feature/*']

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Exercises the deploy-side build pipeline on every PR so deploy.yml
  # surprises (layer build perms, CFN syntax, missing CodeUri files)
  # surface BEFORE merge — not after. Added 2026-04-27 after deploy
  # 24989063876 failed at the layer-build step on a "12/12 green" PR.
  deploy-readiness:
    name: "Deploy Readiness"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_DEFAULT_REGION: eu-west-1
      SAM_CLI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SAM CLI
        run: pip install aws-sam-cli
      - name: Build shared-deps layer (catches Docker permission / shared/ packaging bugs)
        run: ./layer/build.sh
      # --lint matters, and its absence cost six consecutive failed deploys on
      # 2026-09-30. Plain `sam validate` accepts a template CloudFormation will
      # refuse: it does not detect circular dependencies. `--lint` runs cfn-lint,
      # whose E3004 reported the JobHuntApi <-> HttpApi cycle in under a second.
      # `sam build` cannot see it either, because no changeset is created — so
      # this job was green on the PR that introduced it. Rule 12: fix the
      # instrument. See .cfnlintrc.yaml for the one rule that is ignored and why.
      - name: SAM Validate --lint (CFN syntax, Ref/GetAtt resolution, CIRCULAR DEPS)
        run: sam validate --lint --region eu-west-1
      - name: SAM Build (catches missing CodeUri files, broken Dockerfile, wrong Handlers)
        env:
          DOCKER_BUILDKIT: "0"
        run: sam build
      # Runtime-import smoke — catches the PR #12 / 2026-04-29 class of bug where
      # `sam build` succeeds but a module the container Lambda imports lazily
      # (e.g. `from lambdas.pipeline.ai_helper import ...`) is missing from the
      # image. `sam build` validates the image builds; this step actually loads
      # app.py inside the built image to exercise import resolution.
      # Uses no untrusted GitHub event inputs.
      - name: Runtime import smoke (API container)
        run: |
          set -eo pipefail
          IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E 'jobhuntapi|JobHuntApi' | head -1)
          if [ -z "$IMAGE" ]; then
            echo "::warning::No API container image found from sam build; skipping import smoke"
            exit 0
          fi
          echo "Smoke-testing import resolution inside $IMAGE"
          # Real Lambda runtime sets AWS_DEFAULT_REGION automatically; bare
          # `docker run` does not. ai_helper.py creates boto3 SSM client at
          # module-load time, which explodes with NoRegionError without it.
          # Env vars below mimic the deployed Lambda env minimally.
          docker run --rm \
            -e AWS_DEFAULT_REGION=eu-west-1 \
            -e SUPABASE_URL=http://localhost \
            -e SUPABASE_SERVICE_KEY=fake \
            --entrypoint /var/lang/bin/python "$IMAGE" -c '
          # Lifespan-execution smoke. The 2026-04-30 incident (PR #42 hotfix)
          # showed that "import app" alone is insufficient — `_initialize_state`
          # runs LAZY imports during FastAPI lifespan startup that bare module
          # imports never trigger. `config/`, and future top-level packages,
          # only get exercised by actually running the lifespan.
          import asyncio
          import app as app_module
          # Eager-import guard: catches module-load-time regressions in shared/
          # and lambdas/ that the lifespan path does NOT exercise.
          from shared.load_job import load_job
          from shared.profile_completeness import check_profile_completeness
          from shared.platform_metadata import fetch_metadata
          from shared.platform_metadata.greenhouse import GreenhouseFetchError
          from shared.platform_metadata.ashby import AshbyFetchError
          from shared.cover_letter_loader import load_cover_letter
          from shared.answer_generator import generate_answer
          from shared.preview_cache import get_preview_cache, set_preview_cache
          from shared.apply_models import ApplyPreviewResponse
          from lambdas.pipeline.ai_helper import ai_complete_cached
          # Lifespan-startup probe: exercises lazy imports inside
          # _initialize_state (e.g. `from config.feature_flags import set_client`)
          # so missing Dockerfile.lambda COPY directives fail CI, not prod.
          async def _run_lifespan():
              async with app_module.app.router.lifespan_context(app_module.app):
                  pass
          asyncio.run(_run_lifespan())
          print("All apply_preview imports + lifespan startup resolved")
          '

  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check lambdas/ tests/ app.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r tests/requirements-test.txt
      - run: pytest tests/unit/ tests/contract/ -v --tb=short -x
        env:
          AWS_DEFAULT_REGION: eu-west-1

  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r tests/requirements-test.txt
      - run: pytest tests/security/ -v --tb=short
        env:
          AWS_DEFAULT_REGION: eu-west-1
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  # This job could not fail until 2026-09-30. Its one step ended in `|| true`
  # and, unlike the four REPORT jobs below (whose `|| true` went in PR #154
  # because they already carried `continue-on-error: true`), it had no
  # continue-on-error — so `|| true` was the only thing between a failing
  # integration suite and a red build. It was the last such step in the repo.
  #
  # It is now a real, blocking gate. Measured before deciding, which is the
  # whole point: 24 tests collect, all 24 execute, none skip, all pass, in
  # 0.04s. They need no credentials and touch no network — tests/integration/
  # test_data_integrity.py mocks every Supabase call, and the suite passes with
  # SUPABASE_URL and SUPABASE_SERVICE_KEY unset entirely. So the usual reason to
  # keep a suite non-blocking (it needs secrets CI may not have) does not apply,
  # and `continue-on-error: true` would be marking a healthy suite optional
  # rather than being honest about a sick one.
  #
  # Two other things went with the `|| true`:
  #   * `-m integration` is gone. The marker filter silently dropped
  #     test_partial_db_insert_failure_still_degrades_quietly, which never got
  #     the decorator — 23 of 24 tests ran and nothing said so (rule 7: scope a
  #     check to the population it is meant to judge). The directory is now the
  #     population, so forgetting a marker cannot shrink the gate again. The
  #     missing marker was added too, so `-m integration` is accurate locally.
  #   * The two Supabase secrets are gone. Handing live production credentials
  #     to a suite that mocks every call buys nothing and means one missed patch
  #     target writes to production — which has already happened here once.
  integration-tests:
    name: "Integration (data integrity)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r tests/requirements-test.txt
      - name: Run integration suite
        run: |
          pytest tests/integration/ -v --tb=short \
                 --junitxml=test-results/integration-junit.xml
        env:
          AWS_DEFAULT_REGION: eu-west-1
      # Exiting 0 is not the same as having run. A blanket skip, a deleted file
      # or a marker filter that matches nothing all exit 0 with no coverage, so
      # the floor asserts the count. Raise it when tests are added; lowering it
      # is a deliberate statement that coverage was removed.
      - name: Assert the suite actually ran
        if: always()
        run: >-
          python scripts/assert_suite_ran.py
          test-results/integration-junit.xml 24 "integration tests"

  # === Quality Pipeline: MUST PASS jobs ===
  data-quality-tests:
    name: "Tier 4b: Data Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r tests/requirements-test.txt
      - run: pytest tests/quality/test_data_quality.py -v --tb=short
        env:
          AWS_DEFAULT_REGION: eu-west-1

  writing-quality-tests:
    name: "Tier 4c: Writing Quality (structural)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r tests/requirements-test.txt
      - run: pytest tests/quality/test_writing_quality.py -v --tb=short
        env:
          AWS_DEFAULT_REGION: eu-west-1

  self-improvement-tests:
    name: "Tier 4d: Self-Improvement"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r tests/requirements-test.txt
      - run: pytest tests/quality/test_self_improvement.py -v --tb=short
        env:
          AWS_DEFAULT_REGION: eu-west-1

  # === Quality Pipeline: REPORT ONLY jobs (don't block PRs) ===
  score-determinism:
    name: "Score Determinism (REPORT)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r tests/requirements-test.txt
      - run: pytest tests/quality/test_score_determinism.py -v --tb=short

  ai-quality-golden:
    name: "AI Quality Golden Dataset (REPORT)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r tests/requirements-test.txt
      - run: pytest tests/quality/test_scoring_quality.py -v --tb=short

  conflict-detection:
    name: "Conflict Detection (REPORT)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r tests/requirements-test.txt
      - run: pytest tests/quality/test_self_improvement.py::TestConflictDetection -v --tb=short

  # Browser E2E. This job used to run
  #   npx playwright test --config=tests/e2e/playwright.config.ts || true
  # against a config file that did not exist, so it reported success on every
  # run and uploaded an empty test-results/ — a gate that could not fail
  # (CLAUDE.md § Verification rules 2). The tests it was pretending to run were
  # 32 empty stubs, all blanket-skipped.
  #
  # It is now a real gate: `pytest` runs tests/e2e/test_critical_journeys.py
  # against a production `vite build` of web/ served locally, driven by
  # Chromium with every HTTP call stubbed in the browser. No `|| true`, so a
  # failure fails the job, and a run that collects nothing exits 5 and fails
  # too. The floor check below covers the remaining hole: a suite that is
  # re-skipped wholesale would otherwise report green with 0 assertions.
  e2e-tests:
    name: "Browser E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Only the test requirements: nothing in tests/e2e/ imports app.py or a
      # lambda, so requirements.txt (and its ~5 minutes of AI/AWS SDKs) is not
      # needed to drive a browser.
      - run: pip install -r tests/requirements-test.txt
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/requirements-test.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: Run browser E2E
        run: |
          pytest tests/e2e/test_critical_journeys.py \
                 --tb=short \
                 --junitxml=test-results/e2e-junit.xml \
                 --screenshot=only-on-failure \
                 --video=retain-on-failure \
                 --output=test-results/artifacts
      # A suite that is skipped wholesale still exits 0. This asserts the run
      # actually executed tests, so re-introducing a blanket skip fails here
      # instead of reading as a pass. Raise the floor when tests are added;
      # lowering it is a deliberate statement that coverage was removed.
      #
      # The check moved out of an inline heredoc into
      # scripts/assert_suite_ran.py, so this job and the integration job cannot
      # drift and the floor logic is itself under test
      # (tests/unit/test_assert_suite_ran.py). Semantics are unchanged: a
      # missing report fails, and fewer than 40 passing tests fails.
      - name: Assert the suite actually ran
        if: always()
        run: >-
          python scripts/assert_suite_ran.py
          test-results/e2e-junit.xml 40 "browser E2E tests"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-e2e-artifacts
          path: test-results/
          retention-days: 7
