name: E2E (Playwright)

# Runs the MOCKED project only.
#
# The live project is deliberately not wired up here. It needs
# SUPABASE_SERVICE_KEY and SUPABASE_JWT_SECRET, and it writes fixture rows into
# the production database -- neither belongs in a workflow that runs on every
# pull request, including ones from forks. Run it locally before a release;
# web/e2e/README.md has the four steps.
#
# The mocked project needs no secrets at all: it serves its own Vite dev server
# and answers every /api/** call inside the browser.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mocked:
    name: mocked (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Cache the browser binary rather than the ~100 MB download per run.
      # Keyed on the Playwright version so a bump fetches a matching browser.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'

      - name: Install system deps for cached browser
        run: npx playwright install-deps chromium
        if: steps.browser-cache.outputs.cache-hit == 'true'

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

      # Traces and screenshots for whatever failed — the thing you actually
      # want when a browser test fails on someone else's machine.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 14
