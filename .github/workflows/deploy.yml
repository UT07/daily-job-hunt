name: Deploy Backend

# Auto-deploy on every push to main, with a paths-ignore filter so pure docs
# or frontend-only changes don't burn a 10-min Lambda deploy. Manual dispatch
# remains available to force a deploy regardless of changed paths.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "web/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/test.yml"
      - ".github/workflows/deploy-frontend.yml"

# Deploys must not race. CloudFormation allows one change set to execute at a
# time against a stack: the second deploy creates its change set, the first
# executes and supersedes it, and the second dies with
#
#     InvalidChangeSetStatus ... cannot be executed in its current execution
#     status of [OBSOLETE]
#
# which is what happened twice on 2026-09-29, on pairs of PRs merged 5 and 7
# seconds apart (#123/#124 at 13:34, #125/#126 at 14:14). Both times the LATER
# commit is the one that failed, so main moved ahead of production silently and
# every subsequent "merged and deployed" claim was wrong until someone read the
# Actions tab.
#
# cancel-in-progress stays FALSE deliberately. Cancelling mid-flight would kill
# a deploy part-way through a CloudFormation update, which is strictly worse
# than waiting: the queued run picks up the newer commit anyway.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # 3.11, matching test.yml and the Lambda runtime, so the gate below runs
      # the suite under the same interpreter CI verified it with.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install SAM CLI
        run: pip install aws-sam-cli

      # The deploy gate. This job used to run only `pytest tests/unit/
      # tests/contract/` before `sam deploy`, and main has no branch
      # protection — so a red lint, integration, security or quality suite, a
      # broken web build, or a template `sam validate --lint` rejects (the
      # 2026-09-30 E3004 cycle) could all deploy. It now runs the same script
      # developers run, which is kept identical to test.yml.
      # VERIFY_REQUIRE_SAM=1 makes a missing sam a failure, not a skip.
      - name: Verify like CI (blocks the deploy)
        env:
          AWS_DEFAULT_REGION: eu-west-1
          VERIFY_REQUIRE_SAM: "1"
        run: |
          set -euo pipefail
          pip install -r requirements.txt -r tests/requirements-test.txt
          (cd web && npm ci)
          bash scripts/verify_like_ci.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to ECR
        run: aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 385017713886.dkr.ecr.eu-west-1.amazonaws.com

      - name: Build shared-deps layer
        # Layer is gitignored (layer/python/) and must be built before sam build,
        # otherwise sam zips only build.sh + requirements.txt (~500 bytes) and
        # every Lambda that depends on supabase/apify/etc fails with ModuleNotFoundError.
        # build.sh uses Docker (linux/amd64) to cross-compile for Lambda runtime.
        run: ./layer/build.sh

      - name: Build tectonic layer
        # layer-tectonic/bin/ is gitignored — this download must run before
        # sam build, otherwise SAM zips only build.sh (~400 bytes) and
        # compile_latex falls back to "tectonic_not_available" silently.
        # Symptom: pipeline runs succeed, jobs land with score but no PDF.
        run: ./layer-tectonic/build.sh

      - name: SAM Build
        env:
          DOCKER_BUILDKIT: "0"
          SAM_CLI_TELEMETRY: "0"
        run: sam build

      - name: SAM Deploy
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          OR_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # May be unset. Empty values are FILTERED OUT below rather than
          # interpolated -- see the long comment on the run block.
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          QWEN_KEY: ${{ secrets.QWEN_API_KEY }}
          NVIDIA_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SB_JWT: ${{ secrets.SUPABASE_JWT_SECRET }}
          SERPER_KEY: ${{ secrets.SERPER_API_KEY }}
          APIFY_KEY: ${{ secrets.APIFY_API_KEY }}
          DAILY_USER_ID: ${{ secrets.DAILY_PIPELINE_USER_ID }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          set -euo pipefail

          # Every secret-backed parameter used to be interpolated inline as
          # "Name=${VAR}". A GitHub secret that does not exist expands to the
          # empty string, so an unset secret produced the argument "Name=",
          # which the SAM CLI rejects outright:
          #
          #   Error: Invalid value for '--parameter-overrides':
          #   CerebrasApiKey= is not a valid format
          #
          # That is a parse error on the whole flag, not a per-parameter
          # warning, so ONE missing optional secret failed the entire deploy
          # before CloudFormation was ever called. CEREBRAS_API_KEY was never
          # added after the provider landed, and every deploy from c15723b
          # through 55ebff2 died this way -- while CI stayed green, so `main`
          # moved four commits ahead of production silently. The comment on
          # CEREBRAS_KEY above used to claim "an empty value is passed through
          # and the provider is skipped at call time". Nothing tested that, and
          # it was false.
          #
          # Required vs optional is not a judgement made here -- template.yaml
          # already encodes it. A parameter with `Default: ''` is survivable:
          # the stack takes the default, the key is absent, and the failover
          # chain skips that provider. A parameter with NO Default must be
          # supplied or the stack has no value for it at all, so an empty one
          # fails loudly and names the secret to set, which is more actionable
          # than SAM's parse error. tests/unit/test_deploy_parameter_overrides.py
          # asserts this split still matches template.yaml's Defaults, so adding
          # a parameter on one side without the other fails in CI rather than at
          # deploy time.
          #
          # Values are never echoed -- only parameter names and secret names.
          OVERRIDES=()
          MISSING=()
          SKIPPED=()

          require() {  # PARAM_NAME VALUE SECRET_NAME
            if [ -z "${2}" ]; then MISSING+=("${3} (parameter ${1})"); else OVERRIDES+=("${1}=${2}"); fi
          }
          optional() {  # PARAM_NAME VALUE
            if [ -z "${2}" ]; then SKIPPED+=("${1}"); else OVERRIDES+=("${1}=${2}"); fi
          }

          # --- required: no Default in template.yaml ---
          require GroqApiKey          "${GROQ_KEY:-}"      GROQ_API_KEY
          require OpenRouterApiKey    "${OR_KEY:-}"        OPENROUTER_API_KEY
          require SupabaseUrl         "${SB_URL:-}"        SUPABASE_URL
          require SupabaseServiceKey  "${SB_KEY:-}"        SUPABASE_SERVICE_KEY
          require SupabaseJwtSecret   "${SB_JWT:-}"        SUPABASE_JWT_SECRET
          require DailyPipelineUserId "${DAILY_USER_ID:-}" DAILY_PIPELINE_USER_ID

          # MCP_ALLOWED_HOSTS is derived from web/.env.production's VITE_API_URL,
          # the same committed file the post-deploy smoke step reads for the API
          # URL -- one source of truth, not a second copy of the host. It cannot
          # come from the template as !Sub "<HttpApi id>..." because that makes
          # the function reference the API while SAM's API body already
          # references the function: a circular dependency CloudFormation
          # refuses. Empty means the transport falls back to localhost-only,
          # which is closed, not open.
          MCP_HOSTS="$(grep -hoE '^VITE_API_URL=.+' web/.env.production 2>/dev/null \
            | cut -d= -f2- | sed -E 's#^https?://##; s#/.*$##')"
          if [ -z "${MCP_HOSTS}" ]; then
            echo "::warning::Could not read VITE_API_URL from web/.env.production — MCP transport will answer for localhost only."
          else
            echo "MCP transport will answer for: ${MCP_HOSTS}"
          fi

          # --- optional: Default: '' in template.yaml ---
          optional McpAllowedHosts "${MCP_HOSTS:-}"
          optional CerebrasApiKey  "${CEREBRAS_KEY:-}"
          optional QwenApiKey      "${QWEN_KEY:-}"
          optional NvidiaApiKey    "${NVIDIA_KEY:-}"
          optional SerperApiKey    "${SERPER_KEY:-}"
          optional ApifyApiKey     "${APIFY_KEY:-}"
          optional PostHogApiKey   "${POSTHOG_KEY:-}"

          if [ ${#MISSING[@]} -ne 0 ]; then
            for m in "${MISSING[@]}"; do
              echo "::error::Required secret not set: ${m}. template.yaml declares it with no Default, so the stack cannot take a fallback." >&2
            done
            exit 1
          fi

          # Announced, not silent. A deploy that quietly drops a parameter is
          # the "status that cannot tell did-the-work from did-nothing" failure
          # this repo keeps paying for (CLAUDE.md rule 2).
          if [ ${#SKIPPED[@]} -ne 0 ]; then
            echo "::warning::Optional parameters omitted (secret unset, template Default applies): ${SKIPPED[*]}"
          else
            echo "All optional parameters supplied."
          fi
          echo "Passing ${#OVERRIDES[@]} secret-backed overrides plus 4 literals."

          sam deploy \
            --stack-name job-hunt-api \
            --region eu-west-1 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --image-repository 385017713886.dkr.ecr.eu-west-1.amazonaws.com/job-hunt-api \
            --s3-bucket utkarsh-job-hunt \
            --s3-prefix sam-artifacts \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --no-disable-rollback \
            --parameter-overrides \
              "${OVERRIDES[@]}" \
              "PostHogHost=https://eu.i.posthog.com" \
              "CouncilEngine=langgraph" \
              "SemanticDedup=on" \
              "BulletRag=on"

      # Post-deploy verification against the REAL deployed system.
      #
      # On 2026-09-29 this repository had 1,686 passing tests and five live
      # production defects, every one of which the suite was structurally
      # unable to see because it mocked the boundary that was broken: S3, the
      # api.js helpers, the resume parser, the database. A mock encodes the
      # author's belief about a boundary, so a test built on one can only
      # confirm that belief.
      #
      # These checks touch the live bucket, the deployed API and the real
      # rows. Each was verified to FAIL against the incident it names before
      # being added — a check nobody has seen fail proves nothing.
      #
      # It runs after the deploy and fails the job, so a broken deploy is
      # visible here rather than the next morning on the dashboard.
      - name: Post-deploy smoke test
        env:
          # The API base URL is NOT a secret — it is committed in
          # web/.env.production and travels in every browser request. It was
          # wired to secrets.API_BASE_URL, that secret was never set, and the
          # step fell through to --quick with a ::warning:: that does not fail
          # a build. The 2026-09-29 17:29 deploy therefore printed
          # "5/5 passed" while api-alive never ran at all.
          #
          # Read it from the committed file instead, so the check cannot be
          # skipped by a missing secret. secrets.API_BASE_URL still wins if
          # someone sets it, for a staging run against a different host.
          SMOKE_API_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AWS_REGION: eu-west-1
          S3_BUCKET: utkarsh-job-hunt
        run: |
          set -euo pipefail
          python -m pip install --quiet -r requirements.txt
          if [ -z "${SMOKE_API_URL:-}" ]; then
            SMOKE_API_URL=$(grep -hoE '^VITE_API_URL=.+' web/.env.production | cut -d= -f2-)
            echo "Using API URL from web/.env.production: $SMOKE_API_URL"
          fi
          if [ -z "$SMOKE_API_URL" ]; then
            echo "::error::No API URL available — refusing to report a partial"
            echo "::error::smoke run as a pass. Set secrets.API_BASE_URL or"
            echo "::error::VITE_API_URL in web/.env.production."
            exit 1
          fi
          SMOKE_API_URL="$SMOKE_API_URL" python scripts/smoke_prod.py
