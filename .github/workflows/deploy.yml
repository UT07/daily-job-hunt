name: Deploy Backend

# Auto-deploy on every push to main, with a paths-ignore filter so pure docs
# or frontend-only changes don't burn a 10-min Lambda deploy. Manual dispatch
# remains available to force a deploy regardless of changed paths.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "web/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/test.yml"
      - ".github/workflows/deploy-frontend.yml"

# Deploys must not race. CloudFormation allows one change set to execute at a
# time against a stack: the second deploy creates its change set, the first
# executes and supersedes it, and the second dies with
#
#     InvalidChangeSetStatus ... cannot be executed in its current execution
#     status of [OBSOLETE]
#
# which is what happened twice on 2026-09-29, on pairs of PRs merged 5 and 7
# seconds apart (#123/#124 at 13:34, #125/#126 at 14:14). Both times the LATER
# commit is the one that failed, so main moved ahead of production silently and
# every subsequent "merged and deployed" claim was wrong until someone read the
# Actions tab.
#
# cancel-in-progress stays FALSE deliberately. Cancelling mid-flight would kill
# a deploy part-way through a CloudFormation update, which is strictly worse
# than waiting: the queued run picks up the newer commit anyway.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SAM CLI
        run: pip install aws-sam-cli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to ECR
        run: aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 385017713886.dkr.ecr.eu-west-1.amazonaws.com

      # NOTE: test.yml runs the full test suite on PRs. This gate re-runs unit
      # and contract tests here to block deploy on main if tests are broken.
      - name: Run unit tests before deploy
        run: |
          pip install -r requirements.txt -r tests/requirements-test.txt
          pytest tests/unit/ tests/contract/ -v --tb=short -x
        env:
          AWS_DEFAULT_REGION: eu-west-1

      - name: Build shared-deps layer
        # Layer is gitignored (layer/python/) and must be built before sam build,
        # otherwise sam zips only build.sh + requirements.txt (~500 bytes) and
        # every Lambda that depends on supabase/apify/etc fails with ModuleNotFoundError.
        # build.sh uses Docker (linux/amd64) to cross-compile for Lambda runtime.
        run: ./layer/build.sh

      - name: Build tectonic layer
        # layer-tectonic/bin/ is gitignored — this download must run before
        # sam build, otherwise SAM zips only build.sh (~400 bytes) and
        # compile_latex falls back to "tectonic_not_available" silently.
        # Symptom: pipeline runs succeed, jobs land with score but no PDF.
        run: ./layer-tectonic/build.sh

      - name: SAM Build
        env:
          DOCKER_BUILDKIT: "0"
          SAM_CLI_TELEMETRY: "0"
        run: sam build

      - name: SAM Deploy
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          OR_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Unset until the operator adds the secret; an empty value is passed
          # through and the provider is skipped at call time.
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          QWEN_KEY: ${{ secrets.QWEN_API_KEY }}
          NVIDIA_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SB_JWT: ${{ secrets.SUPABASE_JWT_SECRET }}
          SERPER_KEY: ${{ secrets.SERPER_API_KEY }}
          APIFY_KEY: ${{ secrets.APIFY_API_KEY }}
          CAPSOLVER_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
          DAILY_USER_ID: ${{ secrets.DAILY_PIPELINE_USER_ID }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          if [ -z "${DAILY_USER_ID}" ]; then
            echo "::error::DAILY_PIPELINE_USER_ID secret is not set. Set it to the real Supabase user UUID under which the daily pipeline should run." >&2
            exit 1
          fi
          sam deploy \
            --stack-name job-hunt-api \
            --region eu-west-1 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --image-repository 385017713886.dkr.ecr.eu-west-1.amazonaws.com/job-hunt-api \
            --s3-bucket utkarsh-job-hunt \
            --s3-prefix sam-artifacts \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --no-disable-rollback \
            --parameter-overrides \
              "GroqApiKey=${GROQ_KEY}" \
              "OpenRouterApiKey=${OR_KEY}" \
              "CerebrasApiKey=${CEREBRAS_KEY}" \
              "QwenApiKey=${QWEN_KEY}" \
              "NvidiaApiKey=${NVIDIA_KEY}" \
              "GoogleCredentialsJson=PLACEHOLDER_SET_MANUALLY" \
              "SupabaseUrl=${SB_URL}" \
              "SupabaseServiceKey=${SB_KEY}" \
              "SupabaseJwtSecret=${SB_JWT}" \
              "SerperApiKey=${SERPER_KEY}" \
              "ApifyApiKey=${APIFY_KEY}" \
              "CapSolverApiKey=${CAPSOLVER_KEY}" \
              "DailyPipelineUserId=${DAILY_USER_ID}" \
              "PostHogApiKey=${POSTHOG_KEY}" \
              "PostHogHost=https://eu.i.posthog.com" \
              "CouncilEngine=langgraph" \
              "SemanticDedup=on" \
              "BulletRag=on"

      # Post-deploy verification against the REAL deployed system.
      #
      # On 2026-09-29 this repository had 1,686 passing tests and five live
      # production defects, every one of which the suite was structurally
      # unable to see because it mocked the boundary that was broken: S3, the
      # api.js helpers, the resume parser, the database. A mock encodes the
      # author's belief about a boundary, so a test built on one can only
      # confirm that belief.
      #
      # These checks touch the live bucket, the deployed API and the real
      # rows. Each was verified to FAIL against the incident it names before
      # being added — a check nobody has seen fail proves nothing.
      #
      # It runs after the deploy and fails the job, so a broken deploy is
      # visible here rather than the next morning on the dashboard.
      - name: Post-deploy smoke test
        env:
          # The API base URL is NOT a secret — it is committed in
          # web/.env.production and travels in every browser request. It was
          # wired to secrets.API_BASE_URL, that secret was never set, and the
          # step fell through to --quick with a ::warning:: that does not fail
          # a build. The 2026-09-29 17:29 deploy therefore printed
          # "5/5 passed" while api-alive never ran at all.
          #
          # Read it from the committed file instead, so the check cannot be
          # skipped by a missing secret. secrets.API_BASE_URL still wins if
          # someone sets it, for a staging run against a different host.
          SMOKE_API_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AWS_REGION: eu-west-1
          S3_BUCKET: utkarsh-job-hunt
        run: |
          set -euo pipefail
          python -m pip install --quiet -r requirements.txt
          if [ -z "${SMOKE_API_URL:-}" ]; then
            SMOKE_API_URL=$(grep -hoE '^VITE_API_URL=.+' web/.env.production | cut -d= -f2-)
            echo "Using API URL from web/.env.production: $SMOKE_API_URL"
          fi
          if [ -z "$SMOKE_API_URL" ]; then
            echo "::error::No API URL available — refusing to report a partial"
            echo "::error::smoke run as a pass. Set secrets.API_BASE_URL or"
            echo "::error::VITE_API_URL in web/.env.production."
            exit 1
          fi
          SMOKE_API_URL="$SMOKE_API_URL" python scripts/smoke_prod.py
