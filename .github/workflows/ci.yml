name: CI

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
  # Manual, and it exists for one specific job: re-measuring the eval
  # baseline on main. The gate's own failure text says "re-measuring the
  # baseline on main is a legitimate response; re-freezing it to turn this
  # green is not" — and until 2026-10-08 that remedy was impossible, because
  # detect-ai-changes returns false for every event that is not a
  # pull_request, to protect free-tier provider quota. A gate that prescribes
  # a fix its own configuration forbids leaves re-freezing as the only
  # available action, which is the one thing it was written to prevent.
  workflow_dispatch:
    inputs:
      run_eval:
        description: >-
          Run the AI Eval Gate on this ref. Use on main to take a fresh
          baseline measurement, then freeze evals/report.json into
          evals/baseline.json with its provenance.
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
# cancel-in-progress is FALSE on main and true everywhere else. With a
# plain `true`, `github.ref` is identical for every merge, so two merges
# landing seconds apart cancel the earlier commit's run. Measured 2026-10-08:
# commit 4ce5cd2 (#194) is on main with its Test Suite CANCELLED and no re-run,
# so it has never been verified by anything — and with no branch protection,
# nothing noticed. On a branch, superseding an in-flight run is exactly right.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  stale-base-check:
    # FU#14: PR #52 shipped 6 upstream PRs behind main. Force a merge-from-main
    # before review when the gap is wide enough that a silent revert is plausible.
    # Only runs on pull_request; push events are exempt.
    name: Stale-base check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if PR base is too far behind main
        env:
          # PR base.ref comes from a trusted GitHub field, but pass via env to
          # follow the safe-interpolation pattern (no inline ${{ ... }} in run:).
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          STALE_THRESHOLD: "10"
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=200
          MERGE_BASE=$(git merge-base HEAD "origin/$BASE_REF")
          BEHIND=$(git rev-list --count "$MERGE_BASE..origin/$BASE_REF")
          echo "PR is $BEHIND commits behind origin/$BASE_REF (threshold: $STALE_THRESHOLD)"
          if [ "$BEHIND" -gt "$STALE_THRESHOLD" ]; then
            echo "::error::PR is $BEHIND commits behind origin/$BASE_REF. Merge main into your branch before requesting review."
            exit 1
          fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r tests/requirements-test.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short
        env:
          AWS_DEFAULT_REGION: eu-west-1

  detect-ai-changes:
    # Cheap gate for the expensive job below. Runs on every trigger (push
    # AND pull_request) and always succeeds so `ai-eval`'s `needs:` is never
    # blocked by a skipped upstream job — the pull_request/push distinction
    # is handled INSIDE this step instead of via a job-level `if:`, so
    # there's no ambiguity about whether a downstream job's own `if:`
    # overrides GitHub's default "needs must succeed" check on a SKIPPED
    # (as opposed to failed) dependency.
    name: Detect AI-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ai_relevant: ${{ steps.filter.outputs.ai_relevant }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff changed paths against the PR base
        id: filter
        env:
          # Trusted GitHub context fields, passed via env rather than
          # inline ${{ ... }} in `run:`, matching the safe-interpolation
          # pattern the stale-base-check job above already uses for
          # github.event.pull_request.base.ref.
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_EVAL: ${{ github.event.inputs.run_eval }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # The only way to measure this ref deliberately. No path filter:
            # the point of a manual run is usually to measure main, where
            # nothing changed relative to itself.
            echo "Manual dispatch, run_eval=$RUN_EVAL"
            echo "ai_relevant=$RUN_EVAL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event is '$EVENT_NAME', not pull_request — ai-eval only runs on PRs (provider quota)."
            echo "ai_relevant=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed_files.txt
          echo "Changed files in this PR:"
          cat changed_files.txt
          # Everything that changes WHAT THE MODEL IS ASKED, or WHAT IT IS
          # ASKED ABOUT. The original filter listed only the three agent
          # packages and evals/, which left the scoring path itself outside the
          # gate: score_batch.py, ai_helper.py, tailor_resume.py and post_score.py
          # all sit directly under lambdas/pipeline/, not in a watched subdir.
          #
          # Measured 2026-09-29 against baseline commit f0a3648: 16 commits had
          # landed since the baseline was frozen; 2 touched a watched path and
          # 4 changed scoring through an unwatched one. #116 "Phase 2 — reliable
          # scoring" rewrote 97 lines of score_batch.py and 52 of ai_helper.py
          # without the gate running once. The next PR to touch a watched path
          # is then charged for every unmeasured commit before it, which is
          # exactly what happened to #114 (tier_accuracy 0.85 -> 0.75).
          #
          # resume_parser.py and shared/resume_format.py are included because
          # they decide what the resume IS before it is scored — a parse change
          # moves every score without touching a prompt.
          if grep -qE '^(lambdas/pipeline/(agents|guardrails|retrieval)/|lambdas/pipeline/(score_batch|ai_helper|tailor_resume|post_score|generate_cover_letter)\.py|shared/(work_auth|resume_format)\.py|resume_parser\.py|evals/)' changed_files.txt; then
            echo "AI-relevant path changed — ai-eval will run."
            echo "ai_relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "No AI-relevant path changed — ai-eval will be skipped."
            echo "ai_relevant=false" >> "$GITHUB_OUTPUT"
          fi

  ai-eval:
    name: AI Eval Gate
    needs: detect-ai-changes
    runs-on: ubuntu-latest
    # Only for changes that can move model behaviour; the golden set costs
    # real Groq/OpenRouter free-tier quota, so it does not run on every PR.
    #
    # NOTE for future editors: `github.event.pull_request.changed_files` is
    # a COUNT (an integer), not a list of paths — `contains(that, 'evals/')`
    # can never match anything meaningful and is not how GitHub exposes
    # per-file changes. The actual changed-files list only exists by
    # diffing the checkout (see detect-ai-changes above), which is also why
    # this can't just be an `on.pull_request.paths:` trigger filter on the
    # workflow: that filter applies to every job in the file (it would also
    # gate stale-base-check/unit-tests), not just this one.
    if: needs.detect-ai-changes.outputs.ai_relevant == 'true'
    # 20 -> 30, and the harness now stops itself at EVAL_DEADLINE_S well under
    # it. Measured 2026-10-07: this job was CANCELLED at the 20-minute ceiling
    # twice, before evals/harness.py could write a report at all, and the check
    # then displayed "AI Eval Gate: fail" -- a quality verdict for a run that
    # measured nothing. Raising the ceiling alone would only move the cliff;
    # the deadline is what guarantees a report exists, and the gate reports
    # INCONCLUSIVE when that report covers less than the whole golden set.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r tests/requirements-test.txt

      # lambdas/pipeline/ai_helper.py's get_param() checks an env var first —
      # derived from the SSM parameter's last path segment, e.g.
      # /naukribaba/GROQ_API_KEY -> GROQ_API_KEY — before ever calling SSM
      # (see that function's docstring for the full precedence contract).
      # This job supplies every provider key and Supabase credential it
      # needs as a plain `env:` secret below, so get_param never falls
      # through to SSM and this job needs no AWS credentials at all.
      #
      # It previously configured aws-actions/configure-aws-credentials (the
      # same auth .github/workflows/deploy.yml uses) to let get_param reach
      # SSM directly, but that IAM user has no ssm:GetParameter grant —
      # every provider call failed with AccessDeniedException and the gate
      # reported a meaningless result. Fixing that IAM grant is out of
      # scope; needing no AWS access here at all is the simpler fix.
      - name: Run golden set
        env:
          # Under the job's 30-minute ceiling, so the harness stops ITSELF and
          # writes a partial report rather than being killed with none.
          #
          # This lives in the SAME env block as the keys below, because it
          # arrived in a second one and GitHub rejects duplicate mapping keys:
          # every push to main from 82159a2 (2026-10-07) onward died instantly
          # with "This run likely failed because of a workflow file issue" and
          # no jobs at all. It passed on pull_request only because the file on
          # the PR branch is not what a push event resolves. `yaml.safe_load`
          # silently keeps the LAST duplicate, so local validation said the
          # file was fine AND quietly dropped this very key -- the deadline was
          # never set. tests/unit/test_workflow_files.py now rejects duplicates
          # the way Actions does.
          EVAL_DEADLINE_S: "1500"
          # Measure the engine we deploy. Nothing here used to set
          # COUNCIL_ENGINE, so the harness ran at ai_helper.py:746's "legacy"
          # default — the frozen serial engine with no guard nodes and no
          # repair loop — while the deployed tailor-resume and
          # generate-cover-letter functions both run langgraph. The gate was
          # measuring code that is not in production, and every guard_pass_rate
          # it has ever reported describes the wrong engine.
          #
          # Hardcoded rather than read from a CFN parameter because the
          # workflow cannot see samconfig.toml (it is gitignored). If the stack
          # moves off langgraph this has to move with it, which
          # test_council_engine_parity.py asserts.
          COUNCIL_ENGINE: langgraph
          # Loading the base resume (evals/harness.py:_load_base_resume) and
          # building the golden set both use the direct-env Supabase client
          # (db_client.py), not ai_helper.get_supabase() — same split every
          # one-off script under scripts/ already has. This also now covers
          # any ai_helper.get_supabase() call reached via the council path,
          # through get_param's env-var-first precedence above.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Council provider keys (lambdas/pipeline/ai_helper.py
          # _build_provider_list), resolved via get_param's env-var-first
          # lookup instead of SSM. Groq is the primary provider; the other
          # three are failover depth. DeepSeek is deliberately omitted —
          # CLAUDE.md backlog notes its balance is empty (always 402s) — a
          # provider whose key is absent or whose call fails is simply
          # skipped by the council's own failover, same as in production.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Google AI Studio — the council's only quota independent of Groq and
          # OpenRouter. Without it here the eval gate runs Groq-only: the
          # 2026-09-28 run logged "gemini/... failed: Unable to locate
          # credentials" for every gemini entry, because get_param falls
          # through to SSM and this job has no AWS credentials.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Cerebras — a fifth independent quota, and the largest per-minute
          # token budget in the pool (5 RPM / 30k TPM / 1M TPD free, per its
          # published limits). Same env-var-first path as the keys above: this
          # job has no AWS credentials, so without the plain secret get_param
          # falls through to SSM, fails, and the gate measures a pool with no
          # Cerebras in it. An unset secret is an empty string, which
          # _call_provider treats as "no key" and skips.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        # repeats=1: the CI default. See evals/harness.py's module docstring
        # for why repeats>1 (meaningful score_variance) costs real provider
        # quota and is a local/manual-run knob, not a CI one.
        run: python -m evals.harness 1

      - name: Check the gate
        run: python scripts/check_eval_gate.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/report.json
