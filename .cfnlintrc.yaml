# cfn-lint configuration, read by `sam validate --lint`.
#
# WHY THIS FILE EXISTS: `sam validate` alone does not detect circular
# dependencies. `sam validate --lint` does, via cfn-lint rule E3004. On
# 2026-09-30 a Sub on the HttpApi id inside the JobHuntApi function's
# Environment made the function reference the API while SAM's generated API
# body already referenced the function's ARN. CloudFormation refuses that at
# changeset creation, and `sam build` cannot see it because no changeset is
# created -- so CI was green and six consecutive deploys failed. cfn-lint
# reported it in under a second, and nothing was running cfn-lint.
templates:
  - template.yaml

ignore_checks:
  # E2533: every Lambda declares Runtime python3.11, deprecated 2026-06-30 with
  # updates disabled from 2026-08-31 (29 occurrences). This is REAL and needs
  # fixing -- it is a separate, tracked upgrade across ~25 functions that has to
  # verify every dependency against 3.14, not something to smuggle into an
  # unrelated PR. It is ignored here and only here so the gate can be switched
  # on now: a gate that cannot pass gets disabled, and a disabled gate is how
  # the circular dependency shipped. Remove this entry with the runtime upgrade.
  - E2533
